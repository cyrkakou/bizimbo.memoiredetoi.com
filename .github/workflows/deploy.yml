name: Deploy to Namecheap Shared Hosting

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Namecheap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.SSH_TARGET_DIR || '/home/nkankreone/bizimbo.memoiredetoi.com' }}
        run: |
          # 1. Préparation du répertoire SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 2. Écriture de la clé privée avec saut de ligne garanti et permissions strictes
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 3. Configuration SSH pour compatibilité Namecheap / cPanel (PubkeyAcceptedKeyTypes +ssh-rsa)
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking accept-new
            PubkeyAcceptedKeyTypes +ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            IdentityFile ~/.ssh/deploy_key
          EOF
          chmod 600 ~/.ssh/config

          # 4. Enregistrement de l'hôte distant
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 5. Résolution du chemin absolu
          if [[ "$TARGET_DIR" = /* ]]; then
            REMOTE_PATH="$TARGET_DIR"
          else
            REMOTE_PATH="/home/nkankreone/$TARGET_DIR"
          fi

          echo "🚀 Dossier cible : $REMOTE_PATH"

          # 6. Test de connexion et création du dossier distant
          ssh -v -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p \"$REMOTE_PATH\""

          # 7. Synchronisation rsync des fichiers
          rsync -avz --delete \
            -e "ssh -p $SSH_PORT" \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='*.md' \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

          echo "✅ Déploiement terminé avec succès dans $REMOTE_PATH !"
